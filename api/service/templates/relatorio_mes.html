<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f4f6f9; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f9; padding:24px 0;">
<tr>
    <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
            style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">

            <!-- Header -->
            <tr>
                <td style="background-color:#1a2332; padding:20px 32px;">
                    <h1 style="margin:0; font-size:18px; color:#ffffff; font-weight:600;">
                        SUBJECT
                    </h1>
                </td>
            </tr>

            <!-- Body -->
            <tr>
                <td style="padding:32px;">

                    <!-- Total de erros -->
                    <div style="background-color:#fff3f3; border-left:4px solid #e74c3c; padding:16px 20px; border-radius:4px; margin-bottom:24px;">
                        <p style="margin:0; font-size:14px; color:#666;">Quantidade de erros internos</p>
                        <p style="margin:4px 0 0 0; font-size:28px; font-weight:700; color:#e74c3c;">
                            INTERNAL_ERROR
                        </p>
                    </div>

                    <!-- Horário de maior taxa -->
                    <div style="background-color:#fff8e6; border-left:4px solid #f39c12; padding:16px 20px; border-radius:4px; margin-bottom:24px;">
                        <p style="margin:0; font-size:14px; color:#666;">Horário de maior taxa de erros</p>
                        <p style="margin:4px 0 0 0; font-size:22px; font-weight:700; color:#333;">
                            HOUR_TAX
                        </p>
                    </div>

                    <!-- Rank de serviços -->
                    <div style="margin-bottom:16px;">
                        <h2 style="margin:0 0 12px 0; font-size:15px; color:#333; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">
                            Rank de serviços
                        </h2>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                            style="border-collapse:collapse; border:1px solid #e8ecf0; border-radius:4px;">
                            <tr>
                                <td style="padding:12px 16px; background-color:#f8f9fb; font-size:13px; color:#333; border-bottom:1px solid #e8ecf0;">
                                    <strong>CRM</strong>
                                </td>
                                <td style="padding:12px 16px; background-color:#f8f9fb; font-size:13px; color:#333; text-align:right; border-bottom:1px solid #e8ecf0;">
                                    SERVICE_1
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px; font-size:13px; color:#333; border-bottom:1px solid #e8ecf0;">
                                    <strong>PSP</strong>
                                </td>
                                <td style="padding:12px 16px; font-size:13px; color:#333; text-align:right; border-bottom:1px solid #e8ecf0;">
                                    SERVICE_2
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px; font-size:13px; color:#333;">
                                    <strong>TP</strong>
                                </td>
                                <td style="padding:12px 16px; font-size:13px; color:#333; text-align:right;">
                                    SERVICE_3
                                </td>
                            </tr>
                        </table>
                    </div>

                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td style="padding:16px 32px; background-color:#f8f9fb; border-top:1px solid #e8ecf0;">
                    <p style="margin:0; font-size:12px; color:#999; text-align:center;">
                        Relatório automático — gerado em {date.now()}
                        ID
                    </p>
                </td>
            </tr>

        </table>
        </td>
    </tr>
    </table>
</body>
</html>
